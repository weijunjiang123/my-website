server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 200 "ok\n";
  }

  location = /_astro/ {
    default_type text/plain;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 404 "Asset not found\n";
  }

  # Astro's hashed assets are safe to cache forever once they exist. Missing
  # hashes must never be cached: they can occur briefly during a rolling
  # deployment when old and new containers overlap.
  location ^~ /_astro/ {
    try_files $uri @asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Stable public assets use a short cache so updates do not require renaming.
  location ~* \.(?:woff2?|svg|png|jpg|jpeg|webp|avif)$ {
    try_files $uri @asset_not_found;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location @asset_not_found {
    types { }
    default_type text/plain;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 404 "Asset not found\n";
  }
}
